version: '2.4'

services:
  ubuntu-xfce-vnc:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu-xfce-vnc
    container_name: ubuntu-xfce-vnc
    ports:
      - "5900:5900"
    restart: unless-stopped
    cpus: '1'
    mem_limit: 2g
    mem_reservation: 1g
    networks:
      - kooterm-net

  kooterm:
    build: .
    container_name: kooterm
    depends_on:
      - ubuntu-xfce-vnc
    ports:
      - "53001:3001"
    environment:
      VNC_HOST: ubuntu-xfce-vnc
      VNC_PORT: "5900"
      VNC_ENABLE: "true"
    restart: unless-stopped
    cpus: '0.5'
    mem_limit: 1g
    mem_reservation: 512m
    networks:
      - kooterm-net

networks:
  kooterm-net:
    driver: bridge